<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <rect width="720" height="480" fill="#f7f8fa"/>
  <rect x="0" y="0" width="340" height="480" fill="#3057d5"/>
  <text x="40" y="220" font-family="sans-serif" font-size="26" fill="#fff" font-weight="bold">PhotoSphere AI</text>
  <text x="40" y="250" font-family="sans-serif" font-size="13" fill="#dbe4ff">AI-organized photo storage,</text>
  <text x="40" y="270" font-family="sans-serif" font-size="13" fill="#dbe4ff">without the manual sorting.</text>

  <rect x="380" y="60" width="300" height="360" rx="12" fill="#ffffff" stroke="#dfe3e8"/>
  <text x="410" y="110" font-family="sans-serif" font-size="20" fill="#1b1f24" font-weight="bold">Create your account</text>

  <rect x="410" y="140" width="240" height="34" rx="8" fill="#fff" stroke="#dfe3e8"/>
  <text x="415" y="132" font-family="sans-serif" font-size="11" fill="#667085">Name</text>

  <rect x="410" y="196" width="240" height="34" rx="8" fill="#fff" stroke="#dfe3e8"/>
  <text x="415" y="188" font-family="sans-serif" font-size="11" fill="#667085">Email</text>

  <rect x="410" y="252" width="240" height="34" rx="8" fill="#fff" stroke="#dfe3e8"/>
  <text x="415" y="244" font-family="sans-serif" font-size="11" fill="#667085">Password</text>

  <rect x="410" y="300" width="240" height="38" rx="8" fill="#3057d5"/>
  <text x="530" y="324" font-family="sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">Sign up</text>
</svg>
