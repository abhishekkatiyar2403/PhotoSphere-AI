<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" font-family="Helvetica, Arial, sans-serif">
  <!-- P6 Option B: global search bar in the top bar -> results overlay -->
  <rect x="0" y="0" width="800" height="600" fill="#f7f8fa"/>

  <!-- Top bar with an inline global search field -->
  <rect x="0" y="0" width="800" height="48" fill="#3057d5"/>
  <text x="20" y="30" fill="#ffffff" font-size="15" font-weight="bold">PhotoSphere AI</text>
  <!-- global search field living in the bar -->
  <rect x="300" y="12" width="300" height="26" rx="13" fill="#ffffff"/>
  <text x="318" y="29" font-size="12" fill="#a0a6b5">🔍  Search photos…</text>
  <text x="740" y="30" fill="#cdd8f7" font-size="12">akatiyar</text>

  <!-- Dimmed page behind (indicates overlay context) -->
  <rect x="0" y="48" width="800" height="552" fill="#eceef3"/>

  <!-- Expanded results overlay panel -->
  <rect x="40" y="64" width="720" height="480" rx="12" fill="#ffffff" stroke="#c3d1f5"/>

  <!-- Overlay search field (mirrors the bar, now active with filters) -->
  <rect x="60" y="84" width="500" height="30" rx="15" fill="#f7f8fa" stroke="#3057d5"/>
  <text x="78" y="104" font-size="12" fill="#333">beach</text>
  <text x="540" y="104" font-size="12" fill="#8a90a0">✕</text>
  <rect x="576" y="84" width="80" height="30" rx="6" fill="#3057d5"/>
  <text x="596" y="104" font-size="12" fill="#ffffff" font-weight="bold">Search</text>
  <text x="672" y="104" font-size="11" fill="#8a90a0">Esc to close</text>

  <!-- Compact filter row (chips + dropdowns) -->
  <rect x="60" y="124" width="88" height="24" rx="4" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="70" y="140" font-size="11" fill="#333">All folders ▾</text>
  <rect x="156" y="124" width="120" height="24" rx="4" fill="#e8eefc" stroke="#c3d1f5"/>
  <text x="166" y="140" font-size="11" fill="#1b3a9e" font-weight="bold">Category: Nature ▾</text>
  <rect x="284" y="124" width="104" height="24" rx="4" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="294" y="140" font-size="11" fill="#333">From 2026-05-01</text>
  <rect x="396" y="124" width="104" height="24" rx="4" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="406" y="140" font-size="11" fill="#333">To 2026-07-06</text>
  <text x="60" y="166" font-size="9" fill="#8a90a0">Categories: People · Nature · Animals · Food · Vehicles · Documents · Screenshots · Uncategorized</text>

  <line x1="60" y1="176" x2="740" y2="176" stroke="#eef1f6"/>
  <text x="60" y="196" font-size="12" fill="#333" font-weight="bold">2 results</text>
  <text x="118" y="196" font-size="11" fill="#8a90a0">for “beach” · Nature</text>

  <!-- Results grid inside the overlay -->
  <rect x="60" y="208" width="160" height="150" rx="6" fill="#ffffff" stroke="#dde1e8"/>
  <rect x="72" y="220" width="136" height="90" fill="#d7dbe4"/>
  <text x="112" y="270" font-size="11" fill="#8a90a0">thumb</text>
  <text x="72" y="330" font-size="11" fill="#333">beach-day.jpg</text>
  <text x="72" y="346" font-size="10" fill="#8a90a0">Nature · Jun 8</text>

  <rect x="236" y="208" width="160" height="150" rx="6" fill="#ffffff" stroke="#dde1e8"/>
  <rect x="248" y="220" width="136" height="90" fill="#d7dbe4"/>
  <text x="288" y="270" font-size="11" fill="#8a90a0">thumb</text>
  <text x="248" y="330" font-size="11" fill="#333">beach-sunset.jpg</text>
  <text x="248" y="346" font-size="10" fill="#8a90a0">Nature · Jun 9</text>

  <text x="60" y="386" font-size="11" fill="#8a90a0">Click a result to open the viewer. Showing 1–2 of 2.</text>

  <!-- No-results empty state (inside the overlay, alternate) -->
  <rect x="60" y="404" width="680" height="112" rx="10" fill="#f7f8fa" stroke="#dde1e8" stroke-dasharray="4,3"/>
  <text x="400" y="446" font-size="13" fill="#5a6070" font-weight="bold" text-anchor="middle">No photos match “beach” with these filters</text>
  <text x="400" y="468" font-size="11" fill="#8a90a0" text-anchor="middle">Clear a filter or widen the date range. Search stays open so you can adjust and retry.</text>
  <text x="400" y="490" font-size="10" fill="#8a90a0" text-anchor="middle">(empty-state — rendered inline when total = 0)</text>

  <!-- Footnote -->
  <text x="24" y="560" font-size="10" fill="#8a90a0">Option B — a global search field in the top bar (present on every page) that expands into a results overlay with compact inline</text>
  <text x="24" y="574" font-size="10" fill="#8a90a0">filters. Always one keystroke away from anywhere; overlay keeps you in context. Filters are tighter; the overlay must stay legible over any page.</text>
</svg>
