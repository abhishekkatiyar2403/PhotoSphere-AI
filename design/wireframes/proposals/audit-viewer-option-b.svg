<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" font-family="Helvetica, Arial, sans-serif">
  <!-- P7 Option B: Activity tab on /guests -->
  <rect x="0" y="0" width="800" height="600" fill="#f7f8fa"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="48" fill="#3057d5"/>
  <text x="20" y="30" fill="#ffffff" font-size="16" font-weight="bold">PhotoSphere AI — Guests</text>
  <text x="730" y="30" fill="#cdd8f7" font-size="12">akatiyar</text>

  <!-- Tab strip: Requests & guests | Activity -->
  <text x="24" y="76" font-size="15" fill="#8a90a0" font-weight="bold">Requests &amp; guests</text>
  <text x="200" y="76" font-size="15" fill="#222" font-weight="bold">Activity</text>
  <rect x="200" y="84" width="66" height="3" rx="1.5" fill="#3057d5"/>
  <line x1="24" y1="86" x2="776" y2="86" stroke="#eef1f6"/>
  <rect x="660" y="60" width="116" height="26" rx="4" fill="#e8eefc" stroke="#c3d1f5"/>
  <text x="676" y="77" font-size="11" fill="#1b3a9e" font-weight="bold">+ Share folders</text>

  <!-- Filter bar (compact, lives inside the tab) -->
  <rect x="24" y="100" width="752" height="40" rx="8" fill="#ffffff" stroke="#dde1e8"/>
  <rect x="40" y="108" width="150" height="24" rx="4" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="50" y="124" font-size="11" fill="#333">All actions</text>
  <text x="176" y="124" font-size="11" fill="#8a90a0">v</text>
  <rect x="200" y="108" width="64" height="24" rx="12" fill="#e8eefc" stroke="#c3d1f5"/>
  <text x="216" y="124" font-size="11" fill="#1b3a9e" font-weight="bold">All</text>
  <rect x="270" y="108" width="66" height="24" rx="12" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="282" y="124" font-size="11" fill="#5a6070">Owner</text>
  <rect x="342" y="108" width="64" height="24" rx="12" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="354" y="124" font-size="11" fill="#5a6070">Guest</text>
  <rect x="500" y="108" width="104" height="24" rx="4" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="510" y="124" font-size="11" fill="#a0a6b5">From date</text>
  <rect x="612" y="108" width="104" height="24" rx="4" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="622" y="124" font-size="11" fill="#a0a6b5">To date</text>
  <rect x="726" y="108" width="34" height="24" rx="5" fill="#3057d5"/>
  <text x="734" y="124" font-size="11" fill="#ffffff" font-weight="bold">Go</text>

  <!-- Feed rows (same row grammar as the Requests&guests tab) -->

  <!-- guest photo_downloaded -->
  <rect x="24" y="150" width="752" height="46" rx="8" fill="#ffffff" stroke="#dde1e8"/>
  <rect x="24" y="150" width="6" height="46" rx="3" fill="#3d9a5b"/>
  <text x="44" y="172" font-size="12" fill="#222" font-weight="bold">Downloaded a photo</text>
  <rect x="176" y="160" width="46" height="16" rx="8" fill="#faf1e3"/>
  <text x="184" y="172" font-size="9" fill="#a07a3a" font-weight="bold">GUEST</text>
  <text x="230" y="172" font-size="11" fill="#5a6070">client@example.com</text>
  <text x="44" y="188" font-size="10" fill="#8a90a0">photo in Nature · IP 203.0.113.9</text>
  <text x="712" y="180" font-size="10" fill="#8a90a0">2 min ago</text>

  <!-- guest photo_viewed -->
  <rect x="24" y="204" width="752" height="46" rx="8" fill="#ffffff" stroke="#dde1e8"/>
  <rect x="24" y="204" width="6" height="46" rx="3" fill="#3057d5"/>
  <text x="44" y="226" font-size="12" fill="#222" font-weight="bold">Viewed a photo</text>
  <rect x="150" y="214" width="46" height="16" rx="8" fill="#faf1e3"/>
  <text x="158" y="226" font-size="9" fill="#a07a3a" font-weight="bold">GUEST</text>
  <text x="204" y="226" font-size="11" fill="#5a6070">client@example.com</text>
  <text x="44" y="242" font-size="10" fill="#8a90a0">photo in Nature · IP 203.0.113.9</text>
  <text x="712" y="234" font-size="10" fill="#8a90a0">3 min ago</text>

  <!-- owner access_approved -->
  <rect x="24" y="258" width="752" height="46" rx="8" fill="#ffffff" stroke="#dde1e8"/>
  <rect x="24" y="258" width="6" height="46" rx="3" fill="#3d9a5b"/>
  <text x="44" y="280" font-size="12" fill="#222" font-weight="bold">Approved access</text>
  <rect x="162" y="268" width="52" height="16" rx="8" fill="#e8eefc"/>
  <text x="170" y="280" font-size="9" fill="#1b3a9e" font-weight="bold">OWNER</text>
  <text x="222" y="280" font-size="11" fill="#5a6070">you · for client@example.com</text>
  <text x="712" y="288" font-size="10" fill="#8a90a0">6 min ago</text>

  <!-- owner access_denied (reason) -->
  <rect x="24" y="312" width="752" height="46" rx="8" fill="#ffffff" stroke="#e2b6b6"/>
  <rect x="24" y="312" width="6" height="46" rx="3" fill="#c46b6b"/>
  <text x="44" y="334" font-size="12" fill="#9a5555" font-weight="bold">Denied access</text>
  <rect x="150" y="322" width="52" height="16" rx="8" fill="#e8eefc"/>
  <text x="158" y="334" font-size="9" fill="#1b3a9e" font-weight="bold">OWNER</text>
  <text x="210" y="334" font-size="11" fill="#5a6070">you · for studio@bride.co</text>
  <text x="44" y="350" font-size="10" fill="#8a90a0">reason: too many wrong codes (otp_attempts_exceeded)</text>
  <text x="708" y="342" font-size="10" fill="#8a90a0">14 min ago</text>

  <!-- owner share_created -->
  <rect x="24" y="366" width="752" height="46" rx="8" fill="#ffffff" stroke="#dde1e8"/>
  <rect x="24" y="366" width="6" height="46" rx="3" fill="#3057d5"/>
  <text x="44" y="388" font-size="12" fill="#222" font-weight="bold">Created a share</text>
  <rect x="152" y="376" width="52" height="16" rx="8" fill="#e8eefc"/>
  <text x="160" y="388" font-size="9" fill="#1b3a9e" font-weight="bold">OWNER</text>
  <text x="212" y="388" font-size="11" fill="#5a6070">you</text>
  <text x="44" y="404" font-size="10" fill="#8a90a0">shared Nature with client@example.com · download</text>
  <text x="708" y="396" font-size="10" fill="#8a90a0">18 min ago</text>

  <!-- Pagination -->
  <text x="24" y="436" font-size="11" fill="#8a90a0">Showing 1–5 of 42</text>
  <rect x="620" y="424" width="66" height="24" rx="5" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="636" y="440" font-size="11" fill="#5a6070">Previous</text>
  <rect x="694" y="424" width="66" height="24" rx="5" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="716" y="440" font-size="11" fill="#5a6070">Next</text>

  <!-- Footnote -->
  <text x="24" y="560" font-size="10" fill="#8a90a0">Option B — an "Activity" tab alongside the existing "Requests &amp; guests" feed on /guests. Same filterable list, but no</text>
  <text x="24" y="574" font-size="10" fill="#8a90a0">new nav entry: sharing and its audit trail live on one surface. Owner/guest rows badged; pagination at the foot of the tab.</text>
</svg>
