<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" font-family="Helvetica, Arial, sans-serif">
  <!-- P4 Option B: a "Manage folders" mode / toolbar above the tree -->
  <rect x="0" y="0" width="800" height="600" fill="#f7f8fa"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="48" fill="#3057d5"/>
  <text x="20" y="30" fill="#ffffff" font-size="16" font-weight="bold">PhotoSphere AI — Organize</text>
  <text x="700" y="30" fill="#cdd8f7" font-size="12">akatiyar</text>

  <!-- Sidebar -->
  <rect x="0" y="48" width="220" height="552" fill="#ffffff" stroke="#dde1e8"/>
  <text x="16" y="76" font-size="12" fill="#8a90a0" font-weight="bold">MY PHOTOS</text>
  <rect x="150" y="64" width="62" height="20" rx="10" fill="#e8eefc" stroke="#c3d1f5"/>
  <text x="160" y="78" font-size="10" fill="#1b3a9e" font-weight="bold">Manage</text>

  <!-- Manage toolbar (active mode) -->
  <rect x="8" y="90" width="204" height="30" rx="4" fill="#eef1f6"/>
  <text x="16" y="109" font-size="10" fill="#8a90a0">Select a folder to act on:</text>

  <!-- Folder rows with radio selectors (Nature selected) -->
  <rect x="8" y="124" width="204" height="28" rx="4" fill="#e8eefc"/>
  <circle cx="24" cy="138" r="6" fill="#3057d5"/><circle cx="24" cy="138" r="2.5" fill="#ffffff"/>
  <text x="40" y="143" font-size="13" fill="#1b3a9e" font-weight="bold">Nature</text>
  <text x="188" y="143" font-size="12" fill="#1b3a9e">8</text>

  <circle cx="24" cy="168" r="6" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="40" y="173" font-size="13" fill="#333">People</text><text x="188" y="173" font-size="12" fill="#8a90a0">34</text>
  <circle cx="24" cy="196" r="6" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="40" y="201" font-size="13" fill="#333">Food</text><text x="188" y="201" font-size="12" fill="#8a90a0">12</text>
  <circle cx="24" cy="224" r="6" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="40" y="229" font-size="13" fill="#333">Vacation 2026</text><text x="188" y="229" font-size="12" fill="#8a90a0">3</text>

  <!-- Action buttons for the selected folder -->
  <line x1="8" y1="248" x2="212" y2="248" stroke="#dde1e8"/>
  <text x="16" y="270" font-size="10" fill="#8a90a0" font-weight="bold">ACTIONS ON “NATURE”</text>
  <rect x="12" y="278" width="90" height="26" rx="5" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="30" y="296" font-size="11" fill="#333">Rename</text>
  <rect x="108" y="278" width="100" height="26" rx="5" fill="#3057d5"/>
  <text x="122" y="296" font-size="11" fill="#ffffff" font-weight="bold">Merge into…</text>
  <rect x="12" y="310" width="196" height="26" rx="5" fill="#ffffff" stroke="#e2b6b6"/>
  <text x="30" y="328" font-size="11" fill="#9a5555">Delete folder</text>

  <!-- Main area header -->
  <text x="240" y="80" font-size="15" fill="#222" font-weight="bold">Nature</text>
  <text x="290" y="80" font-size="12" fill="#8a90a0">— 8 photos · Manage mode active</text>

  <!-- Merge destination picker panel (main area) -->
  <rect x="240" y="94" width="536" height="140" rx="10" fill="#ffffff" stroke="#3057d5"/>
  <text x="260" y="120" font-size="14" fill="#222" font-weight="bold">Merge “Nature” into…</text>
  <text x="260" y="140" font-size="11" fill="#8a90a0">Choose a destination. All 8 photos move there, then “Nature” is removed.</text>
  <!-- destination radio list -->
  <circle cx="272" cy="162" r="6" fill="#3057d5"/><circle cx="272" cy="162" r="2.5" fill="#ffffff"/>
  <text x="288" y="167" font-size="12" fill="#333">People — 34 photos</text>
  <circle cx="272" cy="186" r="6" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="288" y="191" font-size="12" fill="#333">Food — 12 photos</text>
  <circle cx="472" cy="162" r="6" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="488" y="167" font-size="12" fill="#333">Vacation 2026 — 3 photos</text>
  <rect x="540" y="150" width="110" height="26" rx="5" fill="#3057d5"/>
  <text x="556" y="168" font-size="12" fill="#ffffff" font-weight="bold">Merge folders</text>
  <rect x="656" y="150" width="70" height="26" rx="5" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="674" y="168" font-size="12" fill="#5a6070">Cancel</text>
  <text x="260" y="222" font-size="10" fill="#8a90a0">Result: People will hold 34 + 8 = 42 photos.</text>

  <!-- Delete confirm (F2) -->
  <rect x="240" y="248" width="536" height="96" rx="10" fill="#ffffff" stroke="#dde1e8"/>
  <text x="260" y="274" font-size="14" fill="#222" font-weight="bold">Delete “Nature”?</text>
  <rect x="260" y="284" width="496" height="34" rx="6" fill="#eef1f6"/>
  <text x="274" y="305" font-size="11" fill="#333"><tspan font-weight="bold">8 photos will move to Unfiled — not deleted.</tspan> Re-file them any time.</text>
  <rect x="260" y="326" width="120" height="26" rx="5" fill="#b05555"/>
  <text x="278" y="344" font-size="12" fill="#ffffff" font-weight="bold">Delete folder</text>
  <rect x="388" y="326" width="70" height="26" rx="5" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="406" y="344" font-size="12" fill="#5a6070">Cancel</text>

  <!-- F1 shared-block banner -->
  <rect x="240" y="360" width="536" height="82" rx="10" fill="#f3e2e2" stroke="#e2b6b6"/>
  <rect x="240" y="360" width="6" height="82" rx="3" fill="#c46b6b"/>
  <text x="260" y="386" font-size="13" fill="#9a5555" font-weight="bold">Can’t delete — “Nature” is shared with a guest</text>
  <text x="260" y="408" font-size="11" fill="#9a5555">Shared with client@example.com. Revoke the share first (409 — folder and photos untouched).</text>
  <rect x="260" y="416" width="130" height="20" rx="4" fill="#ffffff" stroke="#c46b6b"/>
  <text x="272" y="430" font-size="11" fill="#9a5555" font-weight="bold">Go to Guests →</text>

  <!-- Footnote -->
  <text x="240" y="560" font-size="10" fill="#8a90a0">Option B — a “Manage” toggle turns the sidebar into a select-a-folder mode with a Rename/Merge/Delete action bar; Merge and Delete</text>
  <text x="240" y="574" font-size="10" fill="#8a90a0">render as panels in the main area. Actions are explicit and out of the way in normal browsing; one deliberate mode gate before any change.</text>
</svg>
