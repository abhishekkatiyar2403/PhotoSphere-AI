<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" font-family="Helvetica, Arial, sans-serif">
  <!-- Trash Option C: top-bar trash icon + badge, opens a slide-over panel -->
  <rect x="0" y="0" width="800" height="600" fill="#f7f8fa"/>

  <!-- Top bar with trash icon+badge (available from any page) -->
  <rect x="0" y="0" width="800" height="48" fill="#3057d5"/>
  <text x="20" y="30" fill="#ffffff" font-size="16" font-weight="bold">PhotoSphere AI — Organize</text>
  <text x="600" y="30" fill="#cdd8f7" font-size="11">Guests</text>
  <text x="655" y="30" fill="#cdd8f7" font-size="11">Activity</text>
  <text x="712" y="24" font-size="16" fill="#ffffff">🗑</text>
  <circle cx="726" cy="18" r="8" fill="#c46b6b"/>
  <text x="722" y="22" font-size="9" fill="#ffffff" font-weight="bold">3</text>
  <text x="758" y="30" fill="#cdd8f7" font-size="12">akatiyar</text>

  <!-- Underlying page dimmed -->
  <rect x="0" y="48" width="580" height="552" fill="#f7f8fa" opacity="0.5"/>
  <text x="24" y="80" font-size="14" fill="#8a90a0">Organize (dimmed behind the slide-over)</text>

  <!-- Slide-over panel from the right -->
  <rect x="500" y="48" width="300" height="552" fill="#ffffff" stroke="#dde1e8"/>
  <rect x="500" y="48" width="300" height="44" fill="#f7f8fa"/>
  <text x="516" y="75" font-size="13" fill="#222" font-weight="bold">Trash (3)</text>
  <text x="764" y="75" font-size="14" fill="#8a90a0">✕</text>

  <rect x="516" y="102" width="268" height="20" rx="4" fill="#f3e2e2" stroke="#e2b6b6"/>
  <text x="524" y="116" font-size="9" fill="#9a5555" font-weight="bold">Empty trash…</text>

  <!-- Compact list rows -->
  <rect x="512" y="132" width="276" height="66" rx="6" fill="#ffffff" stroke="#e2b6b6"/>
  <text x="524" y="152" font-size="11" fill="#222" font-weight="bold">IMG_0921.jpg</text>
  <text x="524" y="166" font-size="9" fill="#8a90a0">Vacation 2026</text>
  <rect x="524" y="172" width="60" height="16" rx="8" fill="#f3e2e2"/>
  <text x="530" y="184" font-size="8" fill="#9a5555" font-weight="bold">1 day left</text>
  <rect x="600" y="172" width="58" height="18" rx="4" fill="#3057d5"/>
  <text x="608" y="185" font-size="9" fill="#ffffff" font-weight="bold">Recover</text>
  <rect x="662" y="172" width="18" height="18" rx="4" fill="#ffffff" stroke="#c46b6b"/>
  <text x="666" y="185" font-size="10" fill="#9a5555">×</text>

  <rect x="512" y="206" width="276" height="66" rx="6" fill="#ffffff" stroke="#dde1e8"/>
  <text x="524" y="226" font-size="11" fill="#222" font-weight="bold">IMG_1050.jpg</text>
  <text x="524" y="240" font-size="9" fill="#8a90a0">Nature</text>
  <rect x="524" y="246" width="66" height="16" rx="8" fill="#eef1f6"/>
  <text x="530" y="258" font-size="8" fill="#5a6070" font-weight="bold">6 days left</text>
  <rect x="600" y="246" width="58" height="18" rx="4" fill="#3057d5"/>
  <text x="608" y="259" font-size="9" fill="#ffffff" font-weight="bold">Recover</text>
  <rect x="662" y="246" width="18" height="18" rx="4" fill="#ffffff" stroke="#c46b6b"/>
  <text x="666" y="259" font-size="10" fill="#9a5555">×</text>

  <!-- Folder row -->
  <rect x="512" y="280" width="276" height="66" rx="6" fill="#ffffff" stroke="#dde1e8"/>
  <text x="524" y="300" font-size="11" fill="#222" font-weight="bold">📁 Food</text>
  <text x="524" y="314" font-size="9" fill="#8a90a0">12 photos</text>
  <rect x="524" y="320" width="66" height="16" rx="8" fill="#eef1f6"/>
  <text x="530" y="332" font-size="8" fill="#5a6070" font-weight="bold">4 days left</text>
  <rect x="600" y="320" width="58" height="18" rx="4" fill="#3057d5"/>
  <text x="608" y="333" font-size="9" fill="#ffffff" font-weight="bold">Recover</text>
  <rect x="662" y="320" width="18" height="18" rx="4" fill="#ffffff" stroke="#c46b6b"/>
  <text x="666" y="333" font-size="10" fill="#9a5555">×</text>

  <!-- Restore-collision, cramped in the panel width -->
  <rect x="512" y="356" width="276" height="112" rx="8" fill="#f3e2e2" stroke="#e2b6b6"/>
  <text x="524" y="376" font-size="10" fill="#9a5555" font-weight="bold">Can't recover "Nature"</text>
  <text x="524" y="392" font-size="9" fill="#9a5555">A live folder with this name</text>
  <text x="524" y="404" font-size="9" fill="#9a5555">already exists.</text>
  <rect x="524" y="412" width="248" height="20" rx="4" fill="#3057d5"/>
  <text x="534" y="426" font-size="9" fill="#ffffff" font-weight="bold">Merge into existing "Nature"</text>
  <rect x="524" y="438" width="248" height="20" rx="4" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="534" y="452" font-size="9" fill="#5a6070">Rename &amp; restore as "Nature (2)"</text>

  <!-- Empty-trash confirm within panel -->
  <rect x="512" y="484" width="276" height="80" rx="8" fill="#ffffff" stroke="#c46b6b" stroke-width="2"/>
  <text x="524" y="504" font-size="10" fill="#9a5555" font-weight="bold">Empty trash? Cannot be undone.</text>
  <text x="524" y="520" font-size="9" fill="#333">Deletes 2 photos + 1 folder now.</text>
  <rect x="524" y="528" width="248" height="20" rx="4" fill="#b05555"/>
  <text x="536" y="542" font-size="9" fill="#ffffff" font-weight="bold">Empty trash now</text>

  <!-- Footnote -->
  <text x="24" y="586" font-size="10" fill="#8a90a0">Option C — a persistent trash icon+badge in the top bar (visible from every page) opens a slide-over panel; no full</text>
  <text x="24" y="600" font-size="10" fill="#8a90a0" opacity="0">.</text>
</svg>
