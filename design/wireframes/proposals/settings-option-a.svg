<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="600" fill="#f7f7f9"/>
  <!-- topbar -->
  <rect x="0" y="0" width="800" height="56" fill="#ffffff"/>
  <line x1="0" y1="56" x2="800" y2="56" stroke="#e2e2e6"/>
  <text x="24" y="34" font-size="18" font-weight="bold" fill="#1b3a9e">PhotoSphere AI — Settings</text>
  <text x="560" y="34" font-size="13" fill="#555">Upload · Organize · Browse · Search · Guests · Activity · Trash</text>

  <!-- page title -->
  <text x="40" y="100" font-size="24" font-weight="bold" fill="#222">Settings</text>
  <text x="40" y="124" font-size="13" fill="#666">Account-level controls.</text>

  <!-- single card -->
  <rect x="40" y="150" width="720" height="220" rx="10" fill="#ffffff" stroke="#e2e2e6"/>
  <text x="64" y="184" font-size="16" font-weight="bold" fill="#222">Plan (testing only)</text>
  <text x="64" y="206" font-size="12" fill="#888">No payment required. This switches your batch-upload cap, storage quota,</text>
  <text x="64" y="222" font-size="12" fill="#888">and processing priority for testing purposes only.</text>

  <!-- segmented control -->
  <rect x="64" y="246" width="200" height="48" rx="6" fill="#e8eefc" stroke="#1b3a9e" stroke-width="2"/>
  <text x="164" y="275" font-size="14" text-anchor="middle" fill="#1b3a9e" font-weight="bold">Free</text>
  <text x="164" y="288" font-size="10" text-anchor="middle" fill="#1b3a9e">50/batch · 5GB</text>

  <rect x="280" y="246" width="200" height="48" rx="6" fill="#ffffff" stroke="#cfcfd6"/>
  <text x="380" y="275" font-size="14" text-anchor="middle" fill="#333">Pro</text>
  <text x="380" y="288" font-size="10" text-anchor="middle" fill="#777">500/batch · 100GB</text>

  <rect x="496" y="246" width="200" height="48" rx="6" fill="#ffffff" stroke="#cfcfd6"/>
  <text x="596" y="275" font-size="14" text-anchor="middle" fill="#333">Studio</text>
  <text x="596" y="288" font-size="10" text-anchor="middle" fill="#777">1500/batch · 500GB</text>

  <text x="64" y="330" font-size="12" fill="#888">Current: Free · Storage used: 1.2GB / 5GB</text>
  <text x="64" y="350" font-size="11" fill="#aaa">Switching applies immediately — no confirmation needed for a testing control.</text>

  <text x="40" y="420" font-size="11" fill="#999">Option A — one card, a segmented (radio-style) 3-way control, plan applies on click.</text>
</svg>
