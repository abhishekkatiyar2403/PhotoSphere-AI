<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" font-family="Helvetica, Arial, sans-serif">
  <!-- U2 Option A: Two-column dashboard - approval queue left, guest roster right -->
  <rect x="0" y="0" width="800" height="600" fill="#f7f8fa"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="48" fill="#3057d5"/>
  <text x="20" y="30" fill="#ffffff" font-size="16" font-weight="bold">PhotoSphere AI — Guests</text>
  <text x="700" y="30" fill="#cdd8f7" font-size="12">akatiyar</text>

  <!-- Left column: pending approval queue -->
  <text x="24" y="78" font-size="15" fill="#222" font-weight="bold">Pending requests</text>
  <rect x="128" y="66" width="22" height="18" rx="9" fill="#f3e2e2"/>
  <text x="135" y="79" font-size="11" fill="#9a5555" font-weight="bold">2</text>

  <!-- Request card 1 -->
  <rect x="24" y="92" width="392" height="150" rx="10" fill="#ffffff" stroke="#e2b6b6"/>
  <text x="40" y="116" font-size="13" fill="#222" font-weight="bold">client@example.com</text>
  <rect x="300" y="102" width="100" height="18" rx="9" fill="#f3e2e2"/>
  <text x="312" y="115" font-size="10" fill="#9a5555" font-weight="bold">Awaiting OTP</text>
  <text x="40" y="136" font-size="10" fill="#8a90a0">IP 203.0.113.9 · Chrome on macOS · 2 min ago</text>
  <text x="40" y="152" font-size="10" fill="#8a90a0">Requesting: Food, Nature (download)</text>
  <text x="40" y="176" font-size="11" fill="#333">Enter the 6-digit code you received to approve:</text>
  <!-- OTP boxes -->
  <rect x="40" y="184" width="26" height="30" rx="4" fill="#ffffff" stroke="#b9c0cf"/>
  <rect x="70" y="184" width="26" height="30" rx="4" fill="#ffffff" stroke="#b9c0cf"/>
  <rect x="100" y="184" width="26" height="30" rx="4" fill="#ffffff" stroke="#b9c0cf"/>
  <rect x="130" y="184" width="26" height="30" rx="4" fill="#ffffff" stroke="#b9c0cf"/>
  <rect x="160" y="184" width="26" height="30" rx="4" fill="#ffffff" stroke="#b9c0cf"/>
  <rect x="190" y="184" width="26" height="30" rx="4" fill="#ffffff" stroke="#b9c0cf"/>
  <rect x="230" y="184" width="90" height="30" rx="5" fill="#3057d5"/>
  <text x="252" y="204" font-size="12" fill="#ffffff" font-weight="bold">Approve</text>
  <rect x="328" y="184" width="76" height="30" rx="5" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="348" y="204" font-size="12" fill="#9a5555">Deny</text>
  <text x="40" y="230" font-size="10" fill="#8a90a0">Attempts: 0 / 3 · code expires in 4:12</text>

  <!-- Request card 2 (compact) -->
  <rect x="24" y="254" width="392" height="72" rx="10" fill="#ffffff" stroke="#e2b6b6"/>
  <text x="40" y="278" font-size="13" fill="#222" font-weight="bold">studio@bride.co</text>
  <text x="40" y="296" font-size="10" fill="#8a90a0">IP 198.51.100.4 · Safari on iOS · 9 min ago · People (view)</text>
  <rect x="230" y="288" width="90" height="28" rx="5" fill="#3057d5"/>
  <text x="248" y="307" font-size="12" fill="#ffffff" font-weight="bold">Enter OTP</text>
  <rect x="328" y="288" width="76" height="28" rx="5" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="348" y="307" font-size="12" fill="#9a5555">Deny</text>

  <!-- Right column: guest roster -->
  <text x="432" y="78" font-size="15" fill="#222" font-weight="bold">Your guests</text>

  <rect x="432" y="92" width="344" height="60" rx="8" fill="#ffffff" stroke="#dde1e8"/>
  <rect x="444" y="104" width="10" height="36" rx="3" fill="#3d9a5b"/>
  <text x="466" y="116" font-size="13" fill="#222" font-weight="bold">client@example.com</text>
  <rect x="640" y="104" width="54" height="18" rx="9" fill="#e3f2e8"/>
  <text x="650" y="117" font-size="10" fill="#3d7a52">Active</text>
  <text x="466" y="134" font-size="10" fill="#8a90a0">Food, Nature · download · last seen 5 min ago</text>
  <rect x="704" y="112" width="60" height="26" rx="4" fill="#ffffff" stroke="#e2b6b6"/>
  <text x="714" y="129" font-size="11" fill="#9a5555">Revoke</text>

  <rect x="432" y="162" width="344" height="60" rx="8" fill="#ffffff" stroke="#dde1e8"/>
  <rect x="444" y="174" width="10" height="36" rx="3" fill="#c7b56b"/>
  <text x="466" y="186" font-size="13" fill="#222" font-weight="bold">mom@family.net</text>
  <rect x="640" y="174" width="66" height="18" rx="9" fill="#faf3dc"/>
  <text x="650" y="187" font-size="10" fill="#8a7a3a">Pending</text>
  <text x="466" y="204" font-size="10" fill="#8a90a0">People · view · invite sent, not yet opened</text>
  <rect x="704" y="182" width="60" height="26" rx="4" fill="#ffffff" stroke="#e2b6b6"/>
  <text x="714" y="199" font-size="11" fill="#9a5555">Revoke</text>

  <rect x="432" y="232" width="344" height="60" rx="8" fill="#ffffff" stroke="#dde1e8"/>
  <rect x="444" y="244" width="10" height="36" rx="3" fill="#c2c8d4"/>
  <text x="466" y="256" font-size="13" fill="#7a808e" font-weight="bold">old-client@gmail.com</text>
  <rect x="640" y="244" width="66" height="18" rx="9" fill="#eef1f6"/>
  <text x="650" y="257" font-size="10" fill="#8a90a0">Revoked</text>
  <text x="466" y="274" font-size="10" fill="#8a90a0">Nature · download · access ended yesterday</text>

  <!-- New share button -->
  <rect x="432" y="304" width="344" height="34" rx="5" fill="#e8eefc" stroke="#c3d1f5"/>
  <text x="560" y="326" font-size="12" fill="#1b3a9e" font-weight="bold">+ Share new folders</text>

  <!-- Footnote -->
  <text x="24" y="560" font-size="10" fill="#8a90a0">U2 Option A — two columns side by side: the live approval queue (with captured IP/device + inline OTP entry) on the</text>
  <text x="24" y="574" font-size="10" fill="#8a90a0">left, the full guest roster with one-tap Revoke on the right. Everything on one screen; can feel dense with many guests.</text>
</svg>
