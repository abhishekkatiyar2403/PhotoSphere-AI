<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" font-family="Helvetica, Arial, sans-serif">
  <!-- U3 Option A: Sequential full-page states (three panels showing the journey) -->
  <rect x="0" y="0" width="800" height="600" fill="#f7f8fa"/>

  <!-- Top bar (guest-branded, no owner nav) -->
  <rect x="0" y="0" width="800" height="48" fill="#3057d5"/>
  <text x="20" y="30" fill="#ffffff" font-size="16" font-weight="bold">PhotoSphere AI</text>
  <text x="640" y="30" fill="#cdd8f7" font-size="12">shared with client@example.com</text>

  <text x="24" y="76" font-size="12" fill="#8a90a0">The guest sees these three full-page states in sequence:</text>

  <!-- PANEL 1: Landing / request access -->
  <rect x="24" y="90" width="240" height="420" rx="10" fill="#ffffff" stroke="#dde1e8"/>
  <text x="40" y="112" font-size="11" fill="#8a90a0" font-weight="bold">1 · LANDING</text>
  <rect x="72" y="128" width="144" height="60" rx="8" fill="#e8eefc"/>
  <text x="112" y="164" font-size="22" fill="#1b3a9e" font-weight="bold">📷</text>
  <text x="40" y="216" font-size="14" fill="#222" font-weight="bold">Akatiyar shared</text>
  <text x="40" y="234" font-size="14" fill="#222" font-weight="bold">2 folders with you</text>
  <text x="40" y="262" font-size="11" fill="#8a90a0">Food · Nature</text>
  <text x="40" y="280" font-size="11" fill="#8a90a0">Download access · expires in 7 days</text>
  <rect x="40" y="304" width="208" height="40" rx="6" fill="#3057d5"/>
  <text x="86" y="329" font-size="13" fill="#ffffff" font-weight="bold">Request access</text>
  <text x="40" y="372" font-size="10" fill="#8a90a0">The owner will get a code to approve</text>
  <text x="40" y="386" font-size="10" fill="#8a90a0">your request. You do not need a</text>
  <text x="40" y="400" font-size="10" fill="#8a90a0">password or account.</text>

  <!-- PANEL 2: Waiting for approval -->
  <rect x="280" y="90" width="240" height="420" rx="10" fill="#ffffff" stroke="#dde1e8"/>
  <text x="296" y="112" font-size="11" fill="#8a90a0" font-weight="bold">2 · WAITING</text>
  <circle cx="400" cy="180" r="34" fill="none" stroke="#e8eefc" stroke-width="8"/>
  <path d="M400 146 A34 34 0 0 1 434 180" fill="none" stroke="#3057d5" stroke-width="8" stroke-linecap="round"/>
  <text x="296" y="248" font-size="14" fill="#222" font-weight="bold">Waiting for approval…</text>
  <text x="296" y="276" font-size="11" fill="#8a90a0">We have notified the owner. They</text>
  <text x="296" y="290" font-size="11" fill="#8a90a0">will approve your request with a</text>
  <text x="296" y="304" font-size="11" fill="#8a90a0">one-time code.</text>
  <rect x="296" y="324" width="208" height="30" rx="6" fill="#eef1f6"/>
  <text x="310" y="344" font-size="11" fill="#8a90a0">Checking every few seconds…</text>
  <text x="296" y="384" font-size="10" fill="#8a90a0">This page will refresh automatically</text>
  <text x="296" y="398" font-size="10" fill="#8a90a0">once you are let in. Keep it open.</text>
  <!-- denied hint -->
  <rect x="296" y="424" width="208" height="60" rx="6" fill="#f7f8fa" stroke="#eef1f6"/>
  <text x="308" y="444" font-size="10" fill="#8a90a0" font-weight="bold">If denied / expired:</text>
  <text x="308" y="462" font-size="10" fill="#8a90a0">a clear message + "Request again"</text>
  <text x="308" y="476" font-size="10" fill="#8a90a0">button (subject to rate limit).</text>

  <!-- PANEL 3: Scoped browser (reuses /browse + PhotoViewer) -->
  <rect x="536" y="90" width="240" height="420" rx="10" fill="#ffffff" stroke="#dde1e8"/>
  <text x="552" y="112" font-size="11" fill="#8a90a0" font-weight="bold">3 · SCOPED BROWSER</text>
  <text x="552" y="132" font-size="9" fill="#1b3a9e">(reuses existing /browse grid + PhotoViewer)</text>
  <!-- mini sidebar -->
  <rect x="552" y="144" width="66" height="120" rx="4" fill="#f7f8fa" stroke="#eef1f6"/>
  <text x="560" y="164" font-size="9" fill="#8a90a0">SHARED</text>
  <rect x="556" y="172" width="58" height="18" rx="3" fill="#e8eefc"/>
  <text x="562" y="185" font-size="10" fill="#1b3a9e">Food 12</text>
  <text x="562" y="208" font-size="10" fill="#333">Nature 8</text>
  <!-- mini grid -->
  <rect x="628" y="144" width="66" height="46" fill="#d7dbe4"/>
  <rect x="700" y="144" width="66" height="46" fill="#d7dbe4"/>
  <rect x="628" y="196" width="66" height="46" fill="#d7dbe4"/>
  <rect x="700" y="196" width="66" height="46" fill="#d7dbe4"/>
  <!-- viewer w/ download -->
  <rect x="552" y="280" width="214" height="140" rx="6" fill="#2a2f3a"/>
  <rect x="576" y="296" width="120" height="90" fill="#54596a"/>
  <text x="586" y="344" font-size="10" fill="#c2c8d4">full-res original</text>
  <rect x="704" y="296" width="52" height="26" rx="4" fill="#3057d5"/>
  <text x="712" y="313" font-size="10" fill="#ffffff">Download</text>
  <text x="704" y="344" font-size="9" fill="#9aa0b0">(shown only if</text>
  <text x="704" y="356" font-size="9" fill="#9aa0b0">download-level)</text>
  <text x="552" y="444" font-size="10" fill="#8a90a0">View-only guests see NO download</text>
  <text x="552" y="458" font-size="10" fill="#8a90a0">button; per-photo, 60s signed URLs.</text>

  <!-- Footnote -->
  <text x="24" y="560" font-size="10" fill="#8a90a0">U3 Option A — three distinct full-page states the guest moves through in sequence (landing → waiting-spinner → scoped</text>
  <text x="24" y="574" font-size="10" fill="#8a90a0">browser). Simplest to reason about; the browser step reuses /browse + PhotoViewer with the download button gated by level.</text>
</svg>
