<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" font-family="Helvetica, Arial, sans-serif">
  <!-- P6 Option C: search as a mode on /browse (sidebar tree stays, grid becomes results) -->
  <rect x="0" y="0" width="800" height="600" fill="#f7f8fa"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="48" fill="#3057d5"/>
  <text x="20" y="30" fill="#ffffff" font-size="16" font-weight="bold">PhotoSphere AI — Browse</text>
  <text x="700" y="30" fill="#cdd8f7" font-size="12">akatiyar</text>

  <!-- Sidebar folder tree (unchanged) -->
  <rect x="0" y="48" width="220" height="552" fill="#ffffff" stroke="#dde1e8"/>
  <text x="16" y="76" font-size="12" fill="#8a90a0" font-weight="bold">MY PHOTOS</text>
  <text x="18" y="104" font-size="13" fill="#333">People</text><text x="188" y="104" font-size="12" fill="#8a90a0">34</text>
  <text x="18" y="132" font-size="13" fill="#333">Nature</text><text x="188" y="132" font-size="12" fill="#8a90a0">8</text>
  <text x="18" y="160" font-size="13" fill="#333">Food</text><text x="188" y="160" font-size="12" fill="#8a90a0">12</text>
  <text x="18" y="188" font-size="13" fill="#333">Vacation 2026</text><text x="188" y="188" font-size="12" fill="#8a90a0">3</text>
  <text x="18" y="216" font-size="13" fill="#8a90a0">Unfiled</text><text x="188" y="216" font-size="12" fill="#8a90a0">2</text>
  <text x="16" y="244" font-size="9" fill="#8a90a0">A search overrides the folder selection until cleared.</text>

  <!-- Search bar spanning the top of the main content area -->
  <rect x="240" y="64" width="536" height="30" rx="15" fill="#ffffff" stroke="#3057d5"/>
  <text x="256" y="84" font-size="12" fill="#333">🔍  IMG_20</text>
  <text x="628" y="84" font-size="12" fill="#8a90a0">✕ clear</text>
  <rect x="690" y="64" width="0" height="0"/>

  <!-- Filter chips row under the search bar -->
  <rect x="240" y="104" width="94" height="22" rx="11" fill="#e8eefc" stroke="#c3d1f5"/>
  <text x="250" y="119" font-size="10" fill="#1b3a9e" font-weight="bold">Category ▾</text>
  <rect x="342" y="104" width="70" height="22" rx="11" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="352" y="119" font-size="10" fill="#5a6070">From ▾</text>
  <rect x="420" y="104" width="70" height="22" rx="11" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="430" y="119" font-size="10" fill="#5a6070">To ▾</text>
  <text x="500" y="119" font-size="9" fill="#8a90a0">Folder = current sidebar selection, or All</text>

  <!-- Results header (mode is active) -->
  <text x="240" y="150" font-size="13" fill="#222" font-weight="bold">Search results</text>
  <text x="352" y="150" font-size="11" fill="#8a90a0">4 photos matching “IMG_20” · across all folders</text>

  <!-- Results grid (same cards as folder browse) -->
  <rect x="240" y="160" width="128" height="140" rx="6" fill="#ffffff" stroke="#dde1e8"/>
  <rect x="250" y="170" width="108" height="80" fill="#d7dbe4"/>
  <text x="278" y="214" font-size="10" fill="#8a90a0">thumb</text>
  <text x="250" y="272" font-size="10" fill="#333">IMG_2041.jpg</text>
  <text x="250" y="286" font-size="9" fill="#8a90a0">Food · Jun 12</text>

  <rect x="376" y="160" width="128" height="140" rx="6" fill="#ffffff" stroke="#dde1e8"/>
  <rect x="386" y="170" width="108" height="80" fill="#d7dbe4"/>
  <text x="414" y="214" font-size="10" fill="#8a90a0">thumb</text>
  <text x="386" y="272" font-size="10" fill="#333">IMG_2044.jpg</text>
  <text x="386" y="286" font-size="9" fill="#8a90a0">Nature · Jun 20</text>

  <rect x="512" y="160" width="128" height="140" rx="6" fill="#ffffff" stroke="#dde1e8"/>
  <rect x="522" y="170" width="108" height="80" fill="#d7dbe4"/>
  <text x="550" y="214" font-size="10" fill="#8a90a0">thumb</text>
  <text x="522" y="272" font-size="10" fill="#333">IMG_2050.jpg</text>
  <text x="522" y="286" font-size="9" fill="#8a90a0">People · Jul 1</text>

  <rect x="648" y="160" width="128" height="140" rx="6" fill="#ffffff" stroke="#dde1e8"/>
  <rect x="658" y="170" width="108" height="80" fill="#d7dbe4"/>
  <text x="686" y="214" font-size="10" fill="#8a90a0">thumb</text>
  <text x="658" y="272" font-size="10" fill="#333">IMG_2088.jpg</text>
  <text x="658" y="286" font-size="9" fill="#8a90a0">Food · Jul 3</text>

  <text x="240" y="322" font-size="11" fill="#8a90a0">Click a photo to open the viewer. Showing 1–4 of 4. Categories: People · Nature · Animals · Food · Vehicles · Documents · Screenshots · Uncategorized.</text>

  <!-- No-results empty state (main area) -->
  <rect x="240" y="340" width="536" height="130" rx="10" fill="#ffffff" stroke="#dde1e8" stroke-dasharray="4,3"/>
  <text x="508" y="386" font-size="13" fill="#5a6070" font-weight="bold" text-anchor="middle">No matches for “IMG_20”</text>
  <text x="508" y="408" font-size="11" fill="#8a90a0" text-anchor="middle">Clear the search to return to browsing your folders,</text>
  <text x="508" y="424" font-size="11" fill="#8a90a0" text-anchor="middle">or widen the date/category filters.</text>
  <text x="508" y="446" font-size="10" fill="#8a90a0" text-anchor="middle">(empty-state — the folder tree stays put on the left)</text>

  <!-- Footnote -->
  <text x="240" y="560" font-size="10" fill="#8a90a0">Option C — search is a mode inside the existing /browse page: a bar + filter chips over the main content; typing a query swaps the</text>
  <text x="240" y="574" font-size="10" fill="#8a90a0">folder grid for a results grid, clearing returns to browsing. Cheapest to build (reuses /browse whole), but search shares/competes for that page.</text>
</svg>
