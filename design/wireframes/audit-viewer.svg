<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" font-family="Helvetica, Arial, sans-serif">
  <!-- P7 Option A: Dedicated /activity page, full filterable feed -->
  <rect x="0" y="0" width="800" height="600" fill="#f7f8fa"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="48" fill="#3057d5"/>
  <text x="20" y="30" fill="#ffffff" font-size="16" font-weight="bold">PhotoSphere AI — Activity</text>
  <text x="612" y="30" fill="#cdd8f7" font-size="12">Guests</text>
  <text x="668" y="30" fill="#ffffff" font-size="12" font-weight="bold">Activity</text>
  <text x="730" y="30" fill="#cdd8f7" font-size="12">akatiyar</text>

  <text x="24" y="76" font-size="15" fill="#222" font-weight="bold">Activity log</text>
  <text x="120" y="76" font-size="11" fill="#8a90a0">who did what to your photos, newest first</text>

  <!-- Filter bar -->
  <rect x="24" y="88" width="752" height="42" rx="8" fill="#ffffff" stroke="#dde1e8"/>
  <text x="40" y="105" font-size="9" fill="#8a90a0" font-weight="bold">ACTION</text>
  <rect x="40" y="110" width="150" height="24" rx="4" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="50" y="126" font-size="11" fill="#333">All actions</text>
  <text x="176" y="126" font-size="11" fill="#8a90a0">v</text>

  <text x="206" y="105" font-size="9" fill="#8a90a0" font-weight="bold">ACTOR</text>
  <rect x="206" y="110" width="70" height="24" rx="12" fill="#e8eefc" stroke="#c3d1f5"/>
  <text x="224" y="126" font-size="11" fill="#1b3a9e" font-weight="bold">All</text>
  <rect x="280" y="110" width="70" height="24" rx="12" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="292" y="126" font-size="11" fill="#5a6070">Owner</text>
  <rect x="354" y="110" width="70" height="24" rx="12" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="366" y="126" font-size="11" fill="#5a6070">Guest</text>

  <text x="446" y="105" font-size="9" fill="#8a90a0" font-weight="bold">FROM</text>
  <rect x="446" y="110" width="104" height="24" rx="4" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="456" y="126" font-size="11" fill="#a0a6b5">2026-07-01</text>
  <text x="562" y="105" font-size="9" fill="#8a90a0" font-weight="bold">TO</text>
  <rect x="562" y="110" width="104" height="24" rx="4" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="572" y="126" font-size="11" fill="#a0a6b5">2026-07-06</text>
  <rect x="686" y="110" width="74" height="24" rx="5" fill="#3057d5"/>
  <text x="700" y="126" font-size="11" fill="#ffffff" font-weight="bold">Apply</text>

  <!-- Feed rows: icon swatch + action label + actor + resource/metadata + IP/time -->

  <!-- Row: guest photo_downloaded -->
  <rect x="24" y="140" width="752" height="52" rx="8" fill="#ffffff" stroke="#dde1e8"/>
  <rect x="24" y="140" width="6" height="52" rx="3" fill="#3d9a5b"/>
  <rect x="42" y="156" width="20" height="20" rx="4" fill="#e3f2e8"/>
  <text x="74" y="162" font-size="12" fill="#222" font-weight="bold">Downloaded a photo</text>
  <rect x="228" y="150" width="46" height="16" rx="8" fill="#faf1e3"/>
  <text x="236" y="162" font-size="9" fill="#a07a3a" font-weight="bold">GUEST</text>
  <text x="284" y="162" font-size="11" fill="#5a6070">client@example.com</text>
  <text x="74" y="180" font-size="10" fill="#8a90a0">photo in Nature · IP 203.0.113.9</text>
  <text x="700" y="180" font-size="10" fill="#8a90a0">2 min ago</text>

  <!-- Row: guest photo_viewed -->
  <rect x="24" y="200" width="752" height="52" rx="8" fill="#ffffff" stroke="#dde1e8"/>
  <rect x="24" y="200" width="6" height="52" rx="3" fill="#3057d5"/>
  <rect x="42" y="216" width="20" height="20" rx="4" fill="#e8eefc"/>
  <text x="74" y="222" font-size="12" fill="#222" font-weight="bold">Viewed a photo</text>
  <rect x="200" y="210" width="46" height="16" rx="8" fill="#faf1e3"/>
  <text x="208" y="222" font-size="9" fill="#a07a3a" font-weight="bold">GUEST</text>
  <text x="256" y="222" font-size="11" fill="#5a6070">client@example.com</text>
  <text x="74" y="240" font-size="10" fill="#8a90a0">photo in Nature · IP 203.0.113.9</text>
  <text x="700" y="240" font-size="10" fill="#8a90a0">3 min ago</text>

  <!-- Row: owner access_approved -->
  <rect x="24" y="260" width="752" height="52" rx="8" fill="#ffffff" stroke="#dde1e8"/>
  <rect x="24" y="260" width="6" height="52" rx="3" fill="#3d9a5b"/>
  <rect x="42" y="276" width="20" height="20" rx="4" fill="#e3f2e8"/>
  <text x="74" y="282" font-size="12" fill="#222" font-weight="bold">Approved access</text>
  <rect x="212" y="270" width="52" height="16" rx="8" fill="#e8eefc"/>
  <text x="220" y="282" font-size="9" fill="#1b3a9e" font-weight="bold">OWNER</text>
  <text x="274" y="282" font-size="11" fill="#5a6070">you</text>
  <text x="74" y="300" font-size="10" fill="#8a90a0">for client@example.com</text>
  <text x="700" y="300" font-size="10" fill="#8a90a0">6 min ago</text>

  <!-- Row: owner access_denied (reason) -->
  <rect x="24" y="320" width="752" height="52" rx="8" fill="#ffffff" stroke="#e2b6b6"/>
  <rect x="24" y="320" width="6" height="52" rx="3" fill="#c46b6b"/>
  <rect x="42" y="336" width="20" height="20" rx="4" fill="#f3e2e2"/>
  <text x="74" y="342" font-size="12" fill="#9a5555" font-weight="bold">Denied access</text>
  <rect x="200" y="330" width="52" height="16" rx="8" fill="#e8eefc"/>
  <text x="208" y="342" font-size="9" fill="#1b3a9e" font-weight="bold">OWNER</text>
  <text x="262" y="342" font-size="11" fill="#5a6070">you</text>
  <text x="74" y="360" font-size="10" fill="#8a90a0">for studio@bride.co · reason: too many wrong codes (otp_attempts_exceeded)</text>
  <text x="694" y="360" font-size="10" fill="#8a90a0">14 min ago</text>

  <!-- Row: owner share_created -->
  <rect x="24" y="380" width="752" height="52" rx="8" fill="#ffffff" stroke="#dde1e8"/>
  <rect x="24" y="380" width="6" height="52" rx="3" fill="#3057d5"/>
  <rect x="42" y="396" width="20" height="20" rx="4" fill="#e8eefc"/>
  <text x="74" y="402" font-size="12" fill="#222" font-weight="bold">Created a share</text>
  <rect x="196" y="390" width="52" height="16" rx="8" fill="#e8eefc"/>
  <text x="204" y="402" font-size="9" fill="#1b3a9e" font-weight="bold">OWNER</text>
  <text x="258" y="402" font-size="11" fill="#5a6070">you</text>
  <text x="74" y="420" font-size="10" fill="#8a90a0">shared Nature with client@example.com · download</text>
  <text x="694" y="420" font-size="10" fill="#8a90a0">18 min ago</text>

  <!-- Pagination -->
  <text x="24" y="462" font-size="11" fill="#8a90a0">Showing 1–5 of 42</text>
  <rect x="620" y="450" width="66" height="24" rx="5" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="636" y="466" font-size="11" fill="#5a6070">Previous</text>
  <rect x="694" y="450" width="66" height="24" rx="5" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="716" y="466" font-size="11" fill="#5a6070">Next</text>

  <!-- Footnote -->
  <text x="24" y="560" font-size="10" fill="#8a90a0">Option A — a dedicated /activity page (own top-bar entry): full filter bar (action / actor toggle / date range) over a</text>
  <text x="24" y="574" font-size="10" fill="#8a90a0">paginated newest-first feed. Owner vs guest rows distinguished by a colored badge. Roomiest; the "who viewed" differentiator gets a real home.</text>
</svg>
